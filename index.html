<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Everything between the two markers is replaced, page by page, by scripts/prerender.mjs
         (title, description, canonical, hreflang, Open Graph, structured data: see src/seo.ts).
         What is written here is only what the dev server shows before the app starts. -->
    <!--seo:start-->
    <title>Ready2Digital — Automazioni, agenti AI e software su misura</title>
    <meta name="description" content="Automazione dei processi, agenti di intelligenza artificiale, CRM, ERP, app e integrazioni su misura." />
    <!--seo:end-->
    <!-- Without JavaScript the page is still readable: the loading curtain would never lift, and the headlines are hidden until the animation shows them. -->
    <noscript><style>.curtain,.wipe{display:none!important}.reveal-line>span{transform:none!important}.hero__fade{opacity:1!important}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
